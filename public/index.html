<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#1b2a4a" />
<title>哥俩好 · 无尽模式</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="app">

  <!-- ============ 首页 ============ -->
  <section class="screen active" id="screen-home">
    <div class="stars"></div>
    <div class="home-card">
      <h1 class="logo">
        <span class="logo-line1">哥俩好</span>
        <span class="logo-line2">无尽模式 · 双人联机</span>
      </h1>

      <label class="field">
        <span>你的昵称</span>
        <input id="inputName" type="text" maxlength="10" placeholder="输入昵称" autocomplete="off" />
      </label>

      <button class="btn btn-primary" id="btnCreate">
        <b>创建房间</b>
        <small>拿到房间号，发给好兄弟</small>
      </button>

      <div class="divider"><span>或者</span></div>

      <div class="join-row">
        <input id="inputCode" type="text" inputmode="numeric" maxlength="6" placeholder="输入房间号" autocomplete="off" />
        <button class="btn btn-ghost" id="btnJoin">加入</button>
      </div>

      <p class="hint">
        🎮 操作：<b>A/←</b> 左移　<b>D/→</b> 右移　<b>W/↑/空格</b> 跳跃
      </p>
      <p class="hint dim">两人被一根绳子绑在一起，身后岩浆墙步步紧逼，跑得越远分越高</p>
    </div>
  </section>

  <!-- ============ 房间 ============ -->
  <section class="screen" id="screen-room">
    <div class="room-card">
      <div class="room-head">
        <span class="room-label">房间号</span>
        <div class="room-code" id="roomCode">0000</div>
        <button class="btn-copy" id="btnCopy">复制</button>
      </div>
      <p class="room-tip" id="roomTip">把房间号发给你的好兄弟，让他输入房间号加入</p>

      <div class="slots">
        <div class="slot" id="slot0">
          <div class="avatar p1">🐵</div>
          <div class="slot-info"><b>房主</b><span class="slot-name">等待中…</span></div>
        </div>
        <div class="slot" id="slot1">
          <div class="avatar p2">🐵</div>
          <div class="slot-info"><b>队友</b><span class="slot-name">等待加入…</span></div>
        </div>
      </div>

      <p class="room-best" id="roomBest"></p>

      <div class="room-actions">
        <button class="btn btn-primary" id="btnStart" disabled>开始游戏</button>
        <button class="btn btn-ghost" id="btnLeave">退出房间</button>
      </div>
      <p class="hint dim" id="roomHint"></p>
    </div>
  </section>

  <!-- ============ 游戏 ============ -->
  <section class="screen" id="screen-game">
    <canvas id="game"></canvas>
    <div class="danger" id="danger"></div>

    <div class="hud">
      <div class="hud-left">
        <div class="lives" id="lives"></div>
      </div>
      <div class="hud-center">
        <div class="score" id="score">0</div>
        <div class="score-sub">最佳 <span id="bestScore">0</span> · 🪙 <span id="coins">0</span> · <span id="timer">0.0″</span></div>
      </div>
      <div class="hud-right">
        <button class="btn-mini" id="btnSound" title="音效">🔊</button>
        <button class="btn-mini" id="btnQuit" title="退出">✕</button>
      </div>
    </div>

    <div class="overlay" id="overlay"></div>

    <div class="touch-controls" id="touchControls">
      <div class="touch-left">
        <button class="tbtn" data-k="left">◀</button>
        <button class="tbtn" data-k="right">▶</button>
      </div>
      <div class="touch-right">
        <button class="tbtn tbtn-jump" data-k="jump">跳</button>
      </div>
    </div>
  </section>

</div>

<div id="toast" class="toast"></div>

<script src="js/app.js"></script>
</body>
</html>
